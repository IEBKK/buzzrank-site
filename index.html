<body>
<meta charset="utf-8">
<title>BuzzRank</title>
<style>
:root {
  color-scheme: light;
  /* chrome & ink -- reference palette, "Chart chrome & ink" */
  --plane:#f9f9f7; --surface:#fcfcfb; --sunk:#f2f2ef;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,0.10);
  /* --muted is the palette's axis/tick ink and is NOT legible as body text
     (~2.9:1). Descriptive prose uses --ink-2 (~7.5:1); --muted is reserved
     for chart ticks and truly tertiary marks. */
  /* data */
  --series-1:#2a78d6; --series-1-wash:rgba(42,120,214,0.10);
  --reference:#898781;
  /* status -- fixed, never themed */
  --good:#006300; --warning:#fab219; --critical:#d03b3b;
  /* interactive chrome only; never a data mark */
  --chrome:#4a3aa7; --chrome-wash:rgba(74,58,167,0.09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --sunk:#141413;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-1-wash:rgba(57,135,229,0.12);
    --reference:#898781;
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --chrome:#9085e9; --chrome-wash:rgba(144,133,233,0.13);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --sunk:#141413;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,0.10);
  --series-1:#3987e5; --series-1-wash:rgba(57,135,229,0.12);
  --reference:#898781;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --chrome:#9085e9; --chrome-wash:rgba(144,133,233,0.13);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Pretendard",
              "Noto Sans KR","Segoe UI",sans-serif;
  font-size:16px; line-height:1.62; word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
.num { font-variant-numeric:tabular-nums; }
.wrap { max-width:1080px; margin:0 auto; padding:0 20px 96px; }

/* ── header ───────────────────────────────────────────── */
header {
  position:sticky; top:0; z-index:20; background:var(--plane);
  border-bottom:1px solid var(--hair); margin-bottom:26px;
}
.bar { max-width:1080px; margin:0 auto; padding:14px 20px 0;
       display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
.brand { font-size:19px; font-weight:800; letter-spacing:-.02em; margin:0;
         display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; min-width:0; }
.brand small { font-size:11px; font-weight:600; letter-spacing:.1em;
               text-transform:uppercase; color:var(--ink-2); }
/* 방문자 카운터. 화제성 지수 바로 옆에 서므로 랭킹 수치처럼 읽히면 안 된다 --
   세로선으로 갈라 두고, 색은 차트 눈금과 같은 --muted 로 눌러 두고, 문장에
   "방문자"를 남겨 무엇을 센 숫자인지 스스로 말하게 한다.
   숫자가 도착하기 전에는 hidden 이라 자리를 차지하지 않는다: "오늘 0명"이
   잠깐 보였다가 바뀌는 것이 아무것도 안 보이는 것보다 나쁘다. */
.hits { font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap;
        font-variant-numeric:tabular-nums; letter-spacing:0; text-transform:none;
        padding-left:9px; border-left:1px solid var(--hair); }
.hits b { color:var(--ink-2); font-weight:700; }
/* 좁은 화면에서는 카운터를 통째로 다음 줄로 내린다. flex-basis:100% 로 못을
   박는 이유: 줄바꿈을 flex 의 자동 계산에 맡겼더니 320px 에서 브랜드 줄이
   접히지 않고 카운터가 화면 밖으로 잘려 나갔다. 아래로 내려온 뒤에는 세로선이
   줄 사이에 떠 있는 선이 되므로 같이 지운다. */
@media (max-width:520px) {
  .hits { flex-basis:100%; padding-left:0; border-left:none; white-space:normal; }
}
.updated { margin-left:auto; font-size:13px; color:var(--ink-2);
           display:flex; align-items:center; gap:7px; flex-wrap:wrap;
           justify-content:flex-end; }
#updated { display:inline-flex; align-items:baseline; gap:10px; flex-wrap:wrap;
           justify-content:flex-end; }
.nextup { color:var(--muted); font-size:12px; }
@media (max-width:700px) { .nextup { flex-basis:100%; text-align:right; } }
.pulse { width:7px; height:7px; border-radius:50%; background:var(--good);
         animation:pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.28} }
nav.tabs { max-width:1080px; margin:0 auto; padding:10px 20px 0; display:flex; gap:22px; }
nav.tabs button {
  background:none; border:none; padding:0 0 10px; font:inherit; font-size:14px;
  font-weight:650; color:var(--ink-2); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
nav.tabs button[aria-current="page"] { color:var(--ink); border-bottom-color:var(--ink); }
nav.tabs button:hover { color:var(--ink-2); }

/* ── notice ───────────────────────────────────────────── */
.notice {
  border:1px solid var(--hair); border-left:3px solid var(--warning);
  background:var(--surface); padding:13px 16px; font-size:13.5px;
  line-height:1.6; margin:0 0 24px; border-radius:3px;
}
.notice b { color:var(--ink); }
.notice .icon { font-style:normal; margin-right:6px; }

/* ── section ──────────────────────────────────────────── */
h2 { font-size:20px; font-weight:780; letter-spacing:-.015em; margin:38px 0 5px; }
h2:first-of-type { margin-top:0; }
.sub { font-size:14px; color:var(--ink-2); margin:0 0 16px; max-width:68ch; }

/* ── rising strip ─────────────────────────────────────── */
.strip { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 12px;
         scroll-snap-type:x proximity; }
.strip::-webkit-scrollbar { height:6px; }
.strip::-webkit-scrollbar-thumb { background:var(--axis); border-radius:3px; }
.rise .rhead { display:flex; gap:10px; align-items:flex-start; }
.rise {
  flex:0 0 218px; scroll-snap-align:start; background:var(--surface);
  border:1px solid var(--hair); border-radius:5px; padding:12px 13px;
  cursor:pointer; text-align:left; font:inherit; color:inherit;
  display:flex; flex-direction:column; gap:7px;
}
.rise:hover { border-color:var(--chrome); }
.rise .nm { font-weight:700; font-size:15px; line-height:1.35;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
            overflow:hidden; }
.rise .vel { font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:7px; }

/* ── controls ─────────────────────────────────────────── */
.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
            margin:0 0 14px; }
.seg { display:flex; border:1px solid var(--hair); border-radius:4px; overflow:hidden; }
.seg button { background:var(--surface); border:none; padding:8px 15px; font:inherit;
              font-size:14px; color:var(--ink-2); cursor:pointer; }
.seg button + button { border-left:1px solid var(--hair); }
.seg button[aria-pressed="true"] { background:var(--chrome-wash); color:var(--chrome);
                                   font-weight:650; }
select, input[type="search"] {
  font:inherit; font-size:14px; padding:8px 12px; border-radius:4px;
  border:1px solid var(--hair); background:var(--surface); color:var(--ink);
}
input[type="search"] { min-width:200px; }
.count { font-size:13.5px; color:var(--ink-2); margin-left:auto; font-weight:600; }

/* ── ranking table ────────────────────────────────────── */
.tw { border:1px solid var(--hair); border-radius:5px; background:var(--surface);
      overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:15px; min-width:760px; }
thead th { text-align:left; font-size:11.5px; font-weight:650; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); padding:11px 14px;
  border-bottom:1px solid var(--axis); background:var(--sunk); white-space:nowrap; }
tbody td { padding:14px; border-bottom:1px solid var(--grid); vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr.row { cursor:pointer; }
tbody tr.row:hover td { background:var(--sunk); }
tbody tr.row:focus-visible { outline:2px solid var(--chrome); outline-offset:-2px; }
/* Rank is the column people scan first, so it gets real weight; the top three
   get a size bump because that is the part of a ranking anyone repeats. */
.rankcell { font-size:17px; font-weight:700; color:var(--ink-2);
            font-variant-numeric:tabular-nums; }
.rankcell.top { font-size:21px; font-weight:800; color:var(--ink); }
td.r { text-align:right; } th.r { text-align:right; }
.title-cell { display:flex; align-items:center; gap:11px; }
.title-cell .tbody { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
.title-cell .nm { font-weight:700; font-size:16px; letter-spacing:-.01em; }
/* The watch provider rides the title in parentheses, set quieter than the
   name so it reads as an attribute of it rather than part of it. */
.plat { color:var(--ink-2); font-weight:500; font-size:14px; }
.delta { font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:3px;
         font-variant-numeric:tabular-nums; }
.delta.up { color:var(--good); } .delta.down { color:var(--critical); }
.delta.flat { color:var(--muted); }
.score { font-weight:800; font-size:19px; letter-spacing:-.02em; }

/* ── chips ────────────────────────────────────────────── */
.chip { display:inline-flex; align-items:center; gap:5px; font-size:12px;
        font-weight:650; padding:3px 9px; border-radius:4px; white-space:nowrap;
        border:1px solid transparent; line-height:1.5; }
/* Freshness is a state, not a category, so it must not borrow the genre hues --
   a reader who has learned "blue = thriller" would otherwise read this as one. */
.fresh{display:inline-flex;align-items:center;gap:.25em;padding:.1em .5em;
  border-radius:999px;font-size:.72em;font-weight:600;letter-spacing:.02em;
  border:1px solid var(--ink-muted);color:var(--ink-secondary);background:transparent}
.fresh.airing{border-style:dashed}
.chip.onchart { color:var(--ink-2); background:var(--sunk); border-color:var(--hair); }
.chip.low { color:var(--ink-2); background:var(--sunk); border-color:var(--warning); }
.chip .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.chip.low .dot { background:var(--warning); }

/* ── velocity meter (ordinal, monochrome) ─────────────── */
.vmeter { display:inline-flex; align-items:center; gap:6px; }
.vmeter .seglist { display:flex; gap:2px; }
.vmeter i { width:6px; height:16px; border-radius:1px; background:var(--grid);
            display:block; }
.vmeter i.on1 { background:var(--muted); }
.vmeter i.on2 { background:var(--ink-2); }
.vmeter i.on3 { background:var(--ink); }
.vmeter .v { font-size:13px; color:var(--ink-2); font-weight:600; }

/* ── cards & tiles ────────────────────────────────────── */
.tiles { display:grid; gap:1px; background:var(--hair); border:1px solid var(--hair);
         border-radius:5px; overflow:hidden;
         grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); margin:0 0 22px; }
.tile { background:var(--surface); padding:16px 18px; }
/* An unmeasured tile must not look like a measured one that scored badly.
   Muted value, dashed edge -- it reads as absent rather than poor. */
.tile.na .val{color:var(--ink-muted);font-weight:500}
.tile.na{border-style:dashed}
.tile.na .foot{color:var(--ink-muted)}
.tile .lab { font-size:12px; color:var(--ink-2); display:block; margin-bottom:4px;
             font-weight:600; }
.tile .val { font-size:28px; font-weight:800; letter-spacing:-.025em; line-height:1.15; }
.tile .foot { font-size:12.5px; color:var(--ink-2); margin-top:5px; }
.card { border:1px solid var(--hair); border-radius:5px; background:var(--surface);
        padding:16px 18px; margin:0 0 20px; }
.card > h3 { font-size:16px; font-weight:750; margin:0 0 3px; letter-spacing:-.01em; }
.card > .sub { margin-bottom:14px; }

/* ── charts ───────────────────────────────────────────── */
.chart-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
              margin-bottom:10px; }
.chart-head .seg { margin-left:auto; }
svg.chart { display:block; width:100%; height:auto; touch-action:none; }
.gridline { stroke:var(--grid); stroke-width:1; }
.axisline { stroke:var(--axis); stroke-width:1; }
.tick { fill:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums; }
.serieline { fill:none; stroke:var(--series-1); stroke-width:2;
             stroke-linejoin:round; stroke-linecap:round; }
.seriearea { fill:var(--series-1-wash); }
.enddot { fill:var(--series-1); stroke:var(--surface); stroke-width:2; }
.crosshair { stroke:var(--axis); stroke-width:1; }
.hoverdot { fill:var(--series-1); stroke:var(--surface); stroke-width:2; }
.barmark { fill:var(--series-1); }
.barmark.ref { fill:var(--reference); }
.barlabel { fill:var(--ink-2); font-size:11.5px; }
.barvalue { fill:var(--ink); font-size:11.5px; font-weight:650;
            font-variant-numeric:tabular-nums; }
.tip {
  position:fixed; pointer-events:none; z-index:40; background:var(--surface);
  border:1px solid var(--hair); border-radius:4px; padding:7px 10px;
  font-size:12px; box-shadow:0 3px 14px rgba(0,0,0,.13); opacity:0;
  transition:opacity .1s; white-space:nowrap;
}
.tip.on { opacity:1; }
.tip .k { color:var(--muted); }
.tip .v { font-weight:700; font-variant-numeric:tabular-nums; }
.tablebtn { background:none; border:1px solid var(--hair); border-radius:3px;
  font:inherit; font-size:11.5px; color:var(--ink-2); padding:3px 9px;
  cursor:pointer; }
.tablebtn:hover { border-color:var(--chrome); color:var(--chrome); }
.datatable { margin-top:12px; }
.datatable table { min-width:0; font-size:12.5px; }

/* ── detail ───────────────────────────────────────────── */
.back { background:none; border:none; font:inherit; font-size:13px; color:var(--chrome);
        cursor:pointer; padding:0; margin:0 0 14px; }
.back:hover { text-decoration:underline; }
h1.dt { font-size:clamp(24px,3.8vw,33px); font-weight:800; letter-spacing:-.022em;
        margin:0 0 10px; text-wrap:balance; }
h1.dt .plat { font-size:.52em; font-weight:600; letter-spacing:-.01em; }
.rise .plat { font-size:.88em; }
.dtmeta { display:flex; gap:9px; flex-wrap:wrap; align-items:center;
          margin:0 0 22px; font-size:14px; color:var(--ink-2); }
.notbuilt { border:1px dashed var(--axis); border-radius:5px; padding:14px 16px;
  color:var(--ink-2); font-size:13.5px; line-height:1.65; margin:0 0 20px; }
.notbuilt b { color:var(--ink-2); }
.notbuilt ul { margin:8px 0 0; padding-left:18px; }
.notbuilt li { margin:3px 0; }

/* ── methodology ──────────────────────────────────────── */
.kv { display:grid; grid-template-columns:auto 1fr; gap:6px 18px; font-size:13.5px;
      margin:10px 0 0; }
.kv dt { color:var(--ink-2); }
.kv dd { margin:0; font-variant-numeric:tabular-nums; }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px;
          color:var(--ink-2); margin-top:10px; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:11px; height:11px; border-radius:2px; display:block; }
footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--hair);
         font-size:13px; color:var(--ink-2); }
.attrib{margin-top:10px;font-size:.78rem;color:var(--muted);line-height:1.6}
.attrib a{color:inherit}
a { color:var(--chrome); }
:focus-visible { outline:2px solid var(--chrome); outline-offset:2px; border-radius:2px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
@media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }
/* ── poster ───────────────────────────────────────────── */
/* Fixed 2:3 box so the row height never depends on whether artwork
   arrived. The placeholder occupies exactly the same box as a real poster,
   which is what keeps the list from reflowing when TMDB is wired up. */
.poster { width:36px; aspect-ratio:2/3; border-radius:3px; flex:none;
          background:var(--sunk); border:1px solid var(--hair);
          object-fit:cover; display:block; }
.stripe { width:4px; align-self:stretch; min-height:34px; border-radius:2px;
           flex:none; display:block; }
/* 유형 칩. 장르 칩과 같은 무게로 두되 색 견본이 없다 -- 유형은 분류이지
   데이터 계열이 아니고, 색을 주면 장르 색과 같은 것을 뜻하는 것처럼 읽힌다. */
.chip.kind { color:var(--ink-2); background:var(--sunk); border-color:var(--hair); }
.chip.kind.anime { border-color:var(--axis); }
.chip.genre { color:var(--ink-2); background:var(--sunk); border-color:var(--hair);
              font-weight:600; }
.chip.genre i { width:9px; height:9px; border-radius:2px; display:block; flex:none; }
.legendcard { margin:0 0 16px; padding:4px 14px; background:var(--surface);
              border:1px solid var(--hair); border-radius:5px; }
.lg-row { display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center;
          font-size:13.5px; color:var(--ink-2); padding:9px 0; }
.lg-row + .lg-row { border-top:1px solid var(--grid); }
.lg-row > span { display:inline-flex; align-items:center; gap:7px; }
.lg-row i { width:12px; height:12px; border-radius:2px; display:block; flex:none; }
.lg-row .seglist i { width:6px; height:14px; border-radius:1px; }
/* The methodology page's genre key used this class without it ever being
   defined, so the swatches rendered at zero width and the labels ran together
   into one string. Invisible while genres were flat colours on a legend nobody
   scrolled to; obvious the moment a swatch had to show two of them. */
.genrekey { display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center;
            font-size:13.5px; color:var(--ink-2); }
.genrekey span { display:inline-flex; align-items:center; gap:7px; }
.genrekey i { width:12px; height:12px; border-radius:2px; display:block; flex:none; }
.gk-title { color:var(--ink); font-weight:700; font-size:13px; min-width:66px; }
.gk-note { color:var(--muted); font-size:12.5px; margin-left:auto; }
@media (max-width:760px) { .gk-note { margin-left:0; flex-basis:100%; } }
.chip.new { color:var(--chrome); background:var(--chrome-wash); border-color:currentColor; }

// "0.0%", which reads as "we scored nothing" -- the opposite of "we did not
// measure this". The real-data run leaves several KPIs deliberately unmeasured
// (entity accuracy does not apply when the article IS the entity), so the

const pct = v => (v === null || v === undefined || Number.isNaN(v))
  ? T.notMeasured : (v * 100).toFixed(1) + '%';
// A lift is a difference between two rates, so it carries its sign: +19.0%p
// says "nineteen points better than the control", 19.0% would read as the rate

  ? T.notMeasured : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%p';

const titleOf = t => (state.lang === 'en' && t.name_en) ? t.name_en : t.name;
const platformOf = p => state.lang === 'en' ? (PLATFORM_EN[p] || p) : p;

/* ── small renderers ────────────────────────────────────────────────── */
function velocityLevel(v) { return v >= 1.5 ? 3 : v >= 1.2 ? 2 : v > 1.0 ? 1 : 0; }
function meterBars(lv) {
  // Wrapped in .vmeter because the bar styling is scoped to it; a bare
  // .seglist renders as three invisible boxes.
  return `<span class="vmeter"><span class="seglist">${[1,2,3].map(i =>
    `<i class="${i <= lv ? 'on' + lv : ''}"></i>`).join('')}</span></span>`;
}
function velocityMeter(v) {
  const lv = velocityLevel(v);
  const bars = [1,2,3].map(i => `<i class="${i <= lv ? 'on' + lv : ''}"></i>`).join('');
  return `<span class="vmeter" title="${T.tileVel} ×${v.toFixed(2)}">
    <span class="seglist">${bars}</span><span class="v num">×${v.toFixed(2)}</span></span>`;
}
function deltaCell(rank, prev) {
  if (prev == null) return `<span class="delta flat">${T.deltaNew}</span>`;
  const d = prev - rank;
  if (d === 0) return '<span class="delta flat">–</span>';
  const up = d > 0;
  return `<span class="delta ${up ? 'up' : 'down'}">${up ? '▲' : '▼'}<span class="num">${Math.abs(d)}</span></span>`;
}
/* Real artwork when the catalogue has it, generated cover art when it does not.
   The generated art references nothing: it is an abstract composition seeded by
   the title id, not an imitation of anyone's poster. Imitating a specific
   copyrighted poster would be a derivative work, which is a worse position for a
   product selling neutrality than simply having no artwork.

   Rendered as inline SVG rather than a data URI so it costs markup, not payload,
   and stays sharp at both the 36px list size and the 112px detail size. Each tile
   is a self-contained dark composition, so it needs no light/dark variant.

   Composition over flat colour is deliberate: a plain coloured square sitting
   beside a status chip reads as another chip. Gradients and shapes read as
   imagery, which is what keeps the page's colour language intact. */
/* Genre is now an *encoding*, not decoration, so it follows the rules that
   apply to categorical colour: a validated palette, a fixed slot per genre, and
   never colour alone. The label rides beside the swatch everywhere it appears.

   Four hues is a hard ceiling, not a preference. Swatches turn up in arbitrary
   combinations down a list, so the palette has to clear the colourblind floors
   on *every* pair rather than adjacent ones, and past four hues it stops doing
   that -- eight slots put red beside orange at ΔE 7.1 under normal vision.

   Ten genres nonetheless fit, because a genre is a *pair* of those four rather
   than one of them: 4 solids + 6 unordered pairs. Every half of every swatch
   comes from the same validated four, so any two genres differ in at least one
   half. See web/genres.py, and re-run scripts/check_palette.sh after any change.

   The classification is read from Wikidata's stated genre (P136) where it
   exists, and inferred from the title's words only where it does not. */
/* A genre is one or two hues, so the swatch is a paint spec rather than a
   colour. Two-tone splits hard at 50% -- no gradient blend, because a blend
   invents intermediate hues that are not in the validated set and that is
   exactly what the four-hue ceiling exists to prevent. */
function genreHues(key) {
  const g = (DATA.genres || {})[key] || (DATA.genres || {}).unknown;
  if (!g) return ['var(--muted)'];
  const v = isDark() ? g.dark : g.light;
  return Array.isArray(v) ? v : [v];
}
function genrePaint(key, angle) {
  const h = genreHues(key);
  if (h.length < 2) return h[0];
  return `linear-gradient(${angle}, ${h[0]} 0 50%, ${h[1]} 50% 100%)`;
}
function genreLabel(key) {
  const g = (DATA.genres || {})[key] || (DATA.genres || {}).unknown;
  if (!g) return '';
  return state.lang === 'en' ? g.en : g.ko;
}
function isDark() {
  const stamped = document.documentElement.getAttribute('data-theme');
  if (stamped) return stamped === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
// One field, one source. Genre used to ride inside `art`, which made it look
// like a property of the cover artwork; it is a property of the work.
function genreOf(t) { return t.genre || 'unknown'; }

/* "Recent" is measured against the corpus, not the reader's clock. A snapshot
   from last month must not quietly reclassify itself as it ages on someone's
   screen. */
/* The service runs on Korea time: data lands once a day at 00:00 KST, so every
   timestamp on the page is shown in KST rather than the UTC the pipeline
   stores. KST is UTC+9 with no daylight saving, so a fixed shift is exact --
   we shift the instant and then read it with the getUTC* accessors, which
   keeps rendering independent of whatever timezone the reader's machine is in. */
const KST_OFFSET_MS = 9 * 3600e3;
function kst(input) { return new Date(new Date(input).getTime() + KST_OFFSET_MS); }
function fmtKstDate(input) {
  const d = kst(input);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
}
function fmtKstDateTime(input) {
  const d = kst(input);
  return `${fmtKstDate(input)} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
}
function fmtKstShort(input) {
  const d = kst(input);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}
/* The next 00:00 KST boundary after the data's own timestamp. */
// Counted from when the ranking was last confirmed, not from where the data
// window ends. Those are four days apart -- pageviews are published on a lag --
// so deriving "next update" from history_end printed a date that had already
// passed: on 21 Aug the page promised the next update on 18 Aug.
function nextUpdate() {
  const d = kst(DATA.generated_at);
  d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() + 1);
  return new Date(d.getTime() - KST_OFFSET_MS);
}

function corpusNow() { return new Date(DATA.history_end).getTime(); }
function daysSinceRelease(t) {
  if (!t.released) return null;
  return Math.floor((corpusNow() - new Date(t.released + 'T00:00:00Z').getTime()) / 864e5);
}
function isNew(t) {
  const d = daysSinceRelease(t);
  return d !== null && d >= 0 && d <= 90;
}
function releasedText(t) {
  if (!t.released) return '';
  const d = daysSinceRelease(t);
  return `${t.released}${d !== null && d >= 0 ? ` · D+${d.toLocaleString()}` : ''}`;
}

// Only rendered when a boost actually applied. A chip that always showed would
// stop meaning anything, and the reason string is what makes it auditable -- a
// boost the reader cannot account for is indistinguishable from a bug.
// 사유는 페이로드의 구조화된 값에서 보는 언어로 조립한다. 예전에는 파이썬이
// 만든 한국어 요약을 그대로 툴팁에 넣어서, 영어 UI 가 "공개 12일차 · 매주 공개
// 중"을 보여주고 있었다.
function freshWhy(t) {
  const bits = [];
  if (t.fresh_days !== null && t.fresh_days !== undefined)
    bits.push(t.fresh_days < 0 ? T.freshSoon : T.freshDay(t.fresh_days));
  if (t.fresh_airing) bits.push(T.freshAiringWhy);
  return bits.join(' · ');
}

function freshChip(t) {
  if (!t.freshness || t.freshness <= 1.0) return '';
  const airing = !!t.fresh_airing;
  const label = airing ? T.freshCadence : T.freshNew;
  return `<span class="fresh${airing ? ' airing' : ''}" title="${esc(T.freshTip(t.freshness.toFixed(2), freshWhy(t)))}">${esc(label)}</span>`;
}

/* The label is not optional and not decoration. Two of the validator's checks
   pass only *because* it is there: light-mode contrast sits below 3:1 for yellow
   and magenta (relief channel required) and dark-mode CVD sits at 6.9, inside
   the 6-8 floor band (secondary encoding required). A swatch shipped without its
   label turns both from conditional passes into failures. */
/* 유형 표시. 필터 탭(전체·영화·시리즈·예능)과 같은 어휘를 쓰므로, 행에서 본
   말을 그대로 탭에서 누를 수 있다. 애니는 kind 와 배타적이지 않아 별도 칩이다 --
   귀멸의 칼날은 "시리즈 · 애니"다. */
function kindChip(t) {
  const label = T.kinds[t.kind] || t.kind;
  const kind = label ? `<span class="chip kind">${esc(label)}</span>` : '';
  return kind + (t.anime ? `<span class="chip kind anime">${esc(T.anime)}</span>` : '');
}

function genreChip(t) {
  const key = genreOf(t);
  return `<span class="chip genre"><i style="background:${genrePaint(key, '135deg')}"></i>${esc(genreLabel(key))}</span>`;
}
function genreStripe(t) {
  // Vertical split on a tall thin bar; the chip's diagonal would read as noise
  // at 4px wide.
  return `<span class="stripe" style="background:${genrePaint(genreOf(t), '180deg')}"
    role="img" aria-label="${esc(genreLabel(genreOf(t)))}"></span>`;
}

function posterCell(t, cls) {
  // A real poster still renders if the catalogue ever supplies one; there is no
  // generated stand-in any more.
  if (!t.poster) return '';
  const name = titleOf(t);
  const alt = state.lang === 'en' ? `${name} poster` : `${name} 포스터`;
  return `<img class="poster ${cls || ''}" src="${t.poster}" alt="${esc(alt)}"
               loading="lazy" width="36" height="54">`;
}

// Platform and first-release date, both inside the same parenthesis so the title
// line stays one unit. The date is the *first* public release, not the latest
// season's -- a returning series is still identified by when it started, and
// showing the newest season date would make a five-year-old show look new.
// Omitted rather than guessed when the dictionary has no release date: an empty
// parenthesis or a placeholder would both read as data.
// A source that shows up twice under one name is unreadable. ko/en is the
// domestic-vs-overseas split FR-2.4 exists to show, so it belongs in the label.
function sourceLabel(c) {
  const base = c.source || '';
  return c.variant ? `${base} (${c.variant})` : base;
}

function platformSuffix(t) {
  const bits = [];
  if (t.platforms && t.platforms.length) bits.push(t.platforms.map(platformOf).join(', '));
  if (t.released) bits.push(t.released);
  else if (t.chart_debut) bits.push(T.chartDebut + ' ' + t.chart_debut);
  if (!bits.length) return '';
  return ` <span class="plat">(${esc(bits.join(' · '))})</span>`;
}
function chips(t) {
  const out = [];
  if (isNew(t)) out.push(`<span class="chip new">${T.chipNew}</span>`);
  if (t.on_chart) out.push(`<span class="chip onchart">${T.chipOn}</span>`);
  if (t.low_signal) out.push(`<span class="chip low"><span class="dot"></span>${T.chipLow}</span>`);
  return out.join(' ');
}

/* ── charts ─────────────────────────────────────────────────────────── */
function sparkline(values, w, h) {
  const max = Math.max(...values, 0.0001), n = values.length;
  const pts = values.map((v, i) => [
    (i / (n - 1)) * (w - 2) + 1, h - 1 - (v / max) * (h - 2)
  ]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
    role="img" aria-label="${esc(T.thTrend)}"><path class="serieline" d="${d}"/></svg>`;
}

function niceCeil(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v || 1)));
  return Math.ceil(v / (p / 2)) * (p / 2) || 1;
}

function areaChart(el, values, stamps, label) {
  const W = el.clientWidth || 640, H = 250;
  const M = { t: 12, r: 14, b: 26, l: 46 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const ceil = niceCeil(Math.max(...values, 0.0001)), n = values.length;
  const x = i => M.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = v => M.t + ih - (v / ceil) * ih;

  const grid = [0, ceil / 2, ceil].map(v =>
    `<line class="gridline" x1="${M.l}" x2="${M.l + iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
     <text class="tick" x="${M.l - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`
  ).join('');
  const line = values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = `M ${x(0).toFixed(1)} ${(M.t + ih).toFixed(1)} ` +
    values.map((v, i) => 'L' + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ') +
    ` L ${x(n - 1).toFixed(1)} ${(M.t + ih).toFixed(1)} Z`;
  const fmt = iso => fmtKstShort(iso);

  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${grid}
    <path class="seriearea" d="${area}"/>
    <path class="serieline" d="${line}"/>
    <circle class="enddot" cx="${x(n - 1).toFixed(1)}" cy="${y(values[n - 1]).toFixed(1)}" r="4"/>
    <line class="axisline" x1="${M.l}" x2="${M.l + iw}" y1="${M.t + ih}" y2="${M.t + ih}"/>
    <text class="tick" x="${M.l}" y="${H - 8}">${fmt(stamps[0])}</text>
    <text class="tick" x="${M.l + iw}" y="${H - 8}" text-anchor="end">${fmt(stamps[n - 1])}</text>
    <g id="hov" style="display:none">
      <line class="crosshair" y1="${M.t}" y2="${M.t + ih}"/>
      <circle class="hoverdot" r="4.5"/>
    </g>
    <rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;

  const svg = $('svg', el), hov = $('#hov', el), tip = $('#tip');
  svg.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let i = Math.round((px - M.l) / (iw || 1) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    hov.style.display = '';
    $('line', hov).setAttribute('x1', x(i)); $('line', hov).setAttribute('x2', x(i));
    $('circle', hov).setAttribute('cx', x(i)); $('circle', hov).setAttribute('cy', y(values[i]));
    tip.innerHTML = `<span class="k">${fmtKstDateTime(stamps[i])} KST</span><br>
      <span class="v">${values[i].toFixed(3)}</span> <span class="k">${esc(T.thBuzz)}</span>`;
    tip.classList.add('on');
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 185) + 'px';
    tip.style.top = (ev.clientY - 52) + 'px';
  });
  svg.addEventListener('pointerleave', () => {
    hov.style.display = 'none'; tip.classList.remove('on');
  });
}

/* One measure across labelled categories -- a single hue, never one per bar. */
function barChart(el, rows, opts) {
  opts = opts || {};
  const W = el.clientWidth || 560, rowH = 36, pad = 8;
  const H = rows.length * rowH + pad;
  const labelW = opts.labelWidth || 128, valueW = 66;
  const iw = W - labelW - valueW;
  // The bar's length must mean what its label says. Scaling to the largest
  // value instead of the real domain turns a 77% vs 74% comparison into a
  // full bar beside a 96% bar -- a truncated axis by another name, on the very
  // chart this page uses to argue that the baseline matters.
  const max = opts.max != null ? opts.max : Math.max(...rows.map(r => r.value), 0.0001);
  const bars = rows.map((r, i) => {
    const th = Math.min(24, rowH - 12);
    const yy = i * rowH + pad / 2 + (rowH - th) / 2;
    const bw = Math.max(2, (r.value / max) * iw);
    const cls = r.reference ? 'barmark ref' : 'barmark';
    const d = `M ${labelW} ${yy} H ${labelW + bw - 4} a4 4 0 0 1 4 4 V ${yy + th - 4}
               a4 4 0 0 1 -4 4 H ${labelW} Z`;
    return `<text class="barlabel" x="${labelW - 10}" y="${yy + th / 2 + 4}"
              text-anchor="end">${esc(r.label)}</text>
            <path class="${cls}" d="${bw > 8 ? d : `M ${labelW} ${yy} h ${bw} v ${th} h -${bw} Z`}"/>
            <text class="barvalue" x="${labelW + bw + 8}" y="${yy + th / 2 + 4}">${esc(r.display)}</text>`;
  }).join('');
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(opts.label || '')}">${bars}</svg>`;
}

function dataTable(id, head, rows) {
  return `<div class="datatable" id="${id}" hidden><div class="tw"><table>
    <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td class="num">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></div>`;
}
function wireTable(btn, id) {
  const b = $(btn), t = $(id);
  if (!b || !t) return;
  b.addEventListener('click', () => {
    t.hidden = !t.hidden;
    b.textContent = t.hidden ? T.showTable : T.hideTable;
    b.setAttribute('aria-expanded', String(!t.hidden));
  });
}

/* ── instrumentation (PRD §15.1) ──────────────────────────────────────
   Vendor-neutral on purpose: events are shaped here and handed to whatever
   sink is installed, so swapping GA4 for Amplitude (or adding both) touches
   one function. With no sink installed the queue just accumulates, which is
   what makes the funnel inspectable in a prototype.

   The event set is chosen to reconstruct the North Star (PRD §2.1) — ranking
   seen → title opened → outbound watch click. A funnel you cannot rebuild from
   the events is a metric you cannot report. */
const EVENTS = [];
function track(event, props) {
  const payload = {
    event,
    ts: new Date().toISOString(),
    lang: state.lang,
    ...props,
  };
  EVENTS.push(payload);
  if (EVENTS.length > 500) EVENTS.shift();
  // Sinks: window.gtag / window.amplitude are picked up if present. Neither is
  // loaded in the prototype, so nothing leaves the page.
  try {
    if (typeof window.gtag === 'function') window.gtag('event', event, props || {});
    if (window.amplitude && window.amplitude.track) window.amplitude.track(event, props || {});
  } catch (e) { /* instrumentation must never break the page */ }
}
window.__buzzrankEvents = EVENTS;

/* ── state & routing ────────────────────────────────────────────────── */
const state = { view:'home', lang:'ko', kind:'all', plat:'all', genre:'all', rel:'all', sort:'score', q:'', id:null, range:'7d' };
const PLATFORMS = [...new Set(DATA.titles.flatMap(t => t.platforms || []))].sort();

function toHash() {
  const carry = state.lang === 'ko' ? '' : 'lang=en';
  if (state.view === 'methodology') return '#/methodology' + (carry ? '?' + carry : '');
  if (state.view === 'detail')
    return '#/title/' + encodeURIComponent(state.id) + '?range=' + state.range + (carry ? '&' + carry : '');
  const p = new URLSearchParams();
  if (state.kind !== 'all') p.set('kind', state.kind);
  if (state.plat !== 'all') p.set('plat', state.plat);
  if (state.genre !== 'all') p.set('genre', state.genre);
  if (state.rel !== 'all') p.set('rel', state.rel);
  if (state.sort !== 'score') p.set('sort', state.sort);
  if (state.q.trim()) p.set('q', state.q.trim());
  if (state.lang !== 'ko') p.set('lang', state.lang);
  const qs = p.toString();
  return '#/' + (qs ? '?' + qs : '');
}
function fromHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const p = new URLSearchParams(qs || '');
  if (['ko','en'].includes(p.get('lang'))) state.lang = p.get('lang');
  // The methodology route is open on the published build too. §1.4-3 makes the
  // page a standing obligation, not an internal view; what the published build
  // withholds is per-source weights, and it withholds them from the payload.
  if (path === 'methodology') { state.view = 'methodology'; return; }
  if (path.startsWith('title/')) {
    const id = decodeURIComponent(path.slice(6));
    if (DATA.titles.some(t => t.id === id)) {
      state.view = 'detail'; state.id = id;
      state.range = ['24h','7d','30d'].includes(p.get('range')) ? p.get('range') : '7d';
      return;
    }
  }
  state.view = 'home';
  state.kind = ['all','movie','series','variety'].includes(p.get('kind')) ? p.get('kind') : 'all';
  state.plat = PLATFORMS.includes(p.get('plat')) ? p.get('plat') : 'all';
  state.genre = Object.keys(DATA.genres || {}).includes(p.get('genre')) ? p.get('genre') : 'all';
  state.rel = ['all','90','365','1095','old'].includes(p.get('rel')) ? p.get('rel') : 'all';
  state.sort = ['score','velocity'].includes(p.get('sort')) ? p.get('sort') : 'score';
  state.q = p.get('q') || '';
}
// `hashchange` is asynchronous: it fires after the current task finishes. The
// previous guard raised a flag, wrote the hash, and lowered the flag in the same
// task, so the flag was always back down by the time the event arrived and it
// guarded nothing. Every navigation therefore ran fromHash() + mount() a second
// time -- a redundant re-render, and a second firing of the mount-time
// instrumentation events.
//
// Remembering the hash we wrote is exact where a flag is not: if the current
// fragment is the one we just set, the DOM already reflects it.
let written = null;
function navigate(top) {
  const h = toHash();
  if (location.hash !== h) { written = h; location.hash = h; }
  mount();
  if (top) scrollTo(0, 0);
}
addEventListener('hashchange', () => {
  if (location.hash === written) { written = null; return; }   // our own write
  written = null;
  fromHash();
  mount();
});

function setLang(lang) {
  state.lang = lang;
  try { localStorage.setItem('buzzrank.lang', lang); } catch (e) {}
  navigate();
}

function visible() {
  let rows = DATA.titles.slice();
  if (state.kind !== 'all') rows = rows.filter(t => t.kind === state.kind);
  if (state.plat !== 'all') rows = rows.filter(t => (t.platforms || []).includes(state.plat));
  if (state.genre !== 'all') rows = rows.filter(t => genreOf(t) === state.genre);
  if (state.rel !== 'all') {
    rows = rows.filter(t => {
      const d = daysSinceRelease(t);
      if (d === null) return false;
      return state.rel === 'old' ? d > 1095 : d >= 0 && d <= Number(state.rel);
    });
  }
  if (state.q.trim()) {
    // Search both spellings regardless of interface language: people paste
    // the name they saw, which is not always the one they are reading in.
    const q = state.q.trim().toLowerCase();
    rows = rows.filter(t =>
      t.name.toLowerCase().includes(q) || (t.name_en || '').toLowerCase().includes(q));
  }
  if (state.sort === 'velocity') rows.sort((a, b) => b.velocity - a.velocity || a.rank - b.rank);
  else rows.sort((a, b) => a.rank - b.rank);
  return rows;
}

/* ── views ──────────────────────────────────────────────────────────── */

      <thead><tr><th class="r">${T.thRank}</th><th class="r">${T.thChange}</th><th>${T.thTitle}</th>
        <th>${T.thTrend}</th><th class="r">${T.thScore}</th><th>${T.thVelocity}</th></tr></thead>
      <tbody>${body || `<tr><td colspan="6" style="color:var(--ink-2)">${T.noResults}</td></tr>`}</tbody>
    </table></div>`;
}

function viewDetail(id) {
  const t = DATA.titles.find(x => x.id === id);
  if (!t) return `<p>${T.notFound}</p>`;
  const buckets = { '24h': 4, '7d': 28, '30d': 120 }[state.range];
  const series = t.series.slice(-buckets);
  const peak = Math.max(...series);
  const totalW = t.sources.reduce((s, c) => s + c.volume, 0) || 1;
  const srcRows = t.sources.map(c => [
    sourceLabel(c), c.volume.toFixed(1), c.raw,
    c.authors || (c.defence_basis ? T.noAuthors : 0), pct(c.volume / totalW)
  ]);
  const other = state.lang === 'en' ? t.name : t.name_en;

  return `
    <button class="back" id="back">${T.back}</button>
    <div class="dthead">
      ${posterCell(t, 'poster-lg')}
      <div>
        <h1 class="dt">${esc(titleOf(t))}${platformSuffix(t)}</h1>
        <div class="dtmeta" style="margin-bottom:0">
          ${other && other !== titleOf(t) ? `<span class="alt">${esc(other)}</span><span>·</span>` : ''}
          <span>${esc(T.kinds[t.kind] || t.kind)}</span><span>·</span>
          ${t.anime ? `<span>${esc(T.anime)}</span><span>·</span>` : ''}
          <span>${esc(t.country)}</span><span>·</span>
          <span>Tier ${esc(t.tier)}</span>
          ${t.released ? `<span>·</span><span>${esc(T.released)} ${esc(releasedText(t))}</span>` : ''}
          ${genreChip(t)}${freshChip(t)}${chips(t)}
        </div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><span class="lab">${T.tileRank}</span>
        <span class="val num">${t.rank}</span>
        <div class="foot">${deltaCell(t.rank, t.prev)} ${T.tileRankFoot}</div></div>
      <div class="tile"><span class="lab">${T.tileScore}</span>
        <span class="val num">${t.score.toFixed(2)}</span>
        <div class="foot">${T.tileScoreFoot(peak.toFixed(2))}</div></div>
      <div class="tile"><span class="lab">${T.tileVel}</span>
        <span class="val num">×${t.velocity.toFixed(2)}</span>
        <div class="foot">${T.tileVelFoot}</div></div>
      <div class="tile"><span class="lab">${T.tileAuthors}</span>
        <span class="val num">${t.authors.toLocaleString()}</span>
        <div class="foot">${T.tileAuthorsFoot}</div></div>
      <div class="tile"><span class="lab">${T.tileQuality}</span>
        <span class="val num">${t.quality.toFixed(2)}</span>
        <div class="foot">${t.quality < 0.95 ? T.qPenalised : T.qClean}</div></div>
    </div>

    <div class="card">
      <div class="chart-head">
        <div><h3>${T.history}</h3>
          <p class="sub" style="margin:0">${T.historySub}</p></div>
        <div class="seg" role="group" aria-label="${esc(T.rangeLabel)}">
          ${['24h','7d','30d'].map(r =>
            `<button data-range="${r}" aria-pressed="${state.range === r}">${r}</button>`).join('')}
        </div>
      </div>
      <div id="hist"></div>
      <div style="margin-top:10px"><button class="tablebtn" id="ht" aria-expanded="false">${T.showTable}</button></div>
      ${dataTable('htable', [T.thTime, T.thBuzz],
        series.map((v, i) => {
          const iso = new Date(new Date(DATA.history_end).getTime()
            - (series.length - 1 - i) * DATA.bucket_hours * 3600e3).toISOString();
          return [fmtKstDateTime(iso), v.toFixed(3)];
        }))}
    </div>

    <div class="card">
      <h3>${T.sources}</h3>
      <p class="sub">${T.sourcesSub}</p>
      <div id="src"></div>
      <div style="margin-top:6px"><button class="tablebtn" id="st" aria-expanded="false">${T.showTable}</button></div>
      ${dataTable('stable', [T.thSource, T.thAdj, T.thRaw, T.thAuthors, T.thShare], srcRows)}
    </div>

    ${(t.platforms || []).length ? `<div class="card">
      <h3>${T.watch}</h3>
      <p class="sub" style="margin-bottom:12px">${T.watchSub}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${t.platforms.map(pf => `<button class="chip onchart watchbtn" data-pf="${esc(pf)}"
            style="font-size:13px;padding:6px 12px;cursor:pointer">${esc(platformOf(pf))}</button>`).join('')}
      </div>
      <p class="sub" style="margin:12px 0 0;font-size:12.5px">${T.watchNote}</p>
    </div>` : ''}

    <div class="notbuilt">
      <b>${T.nbTitle}</b> — ${T.nbLead}
      <ul>${T.nb.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>`;
}

function viewMethodology() {
  const a = DATA.accuracy, c = DATA.corpus;
  const limits = T.limits.concat([T.limitScope(DATA.sources.length)]);
  const corpusVals = [c.documents.toLocaleString(), c.mentions.toLocaleString(),
                      c.dictionary_titles.toLocaleString(), pct(c.dictionary_hit_rate)];
  return `
    <h2>${T.mTitle}</h2>
    <p class="sub">${T.mSub}</p>

    <div class="card">
      <h3>${T.mScoring}</h3>
      <p class="sub" style="margin-bottom:10px">${T.mScoringBody}</p>
      <dl class="kv">${T.mKv.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    </div>

    <h2>${T.mSources}</h2>
    <p class="sub">${T.mSourcesSub}</p>
    <div class="tw"><table>
      <thead><tr><th>${T.thSource}</th><th>${T.thStatus}</th><th class="r">${T.thDocs}</th>
        <th class="r">${T.thWeight}</th></tr></thead>
      <tbody>${DATA.sources.map(s => `
        <tr><td>${esc(s.source)}</td>
          <td><span class="chip ${s.ok ? 'onchart' : 'low'}">${s.ok ? T.ok : T.down}</span></td>
          <td class="num r">${s.documents.toLocaleString()}</td>
          <td class="num r">${s.weight ? s.weight.toFixed(3) : '–'}</td></tr>`).join('')}
      </tbody></table></div>

    <h2>${T.mAcc}</h2>
    <p class="sub">${T.mAccSub}</p>
    <div class="tiles">
      <div class="tile${a.ner === null ? ' na' : ''}"><span class="lab">${T.accNer}</span>
        <span class="val num">${pct(a.ner)}</span>
        <div class="foot">${a.ner === null ? esc(a.ner_note || '')
          : T.accNerFoot(pct(a.ner_baseline), signed(a.ner_lift), a.ner_hits,
                         a.ner_total, a.ner_weeks)}</div></div>
      <div class="tile${a.entity_precision === null ? ' na' : ''}"><span class="lab">${T.accEntity}</span>
        <span class="val num">${pct(a.entity_precision)}</span>
        <div class="foot">${a.entity_precision === null ? esc(a.entity_note || '')
          : T.accEntityFoot(pct(a.entity_recall))}</div></div>
      <div class="tile"><span class="lab">${T.accPersist}</span>
        <span class="val num">${pct(a.overlap_persistence)}</span>
        <div class="foot">${T.accPersistFoot(a.overlap_weeks)}</div></div>
    </div>
    <p class="sub" style="margin:-8px 0 22px">${T.mAccObjective}</p>

    <div class="card">
      <h3>${T.mOverlap}</h3>
      <p class="sub">${T.mOverlapSub}</p>
      <div id="acc"></div>
      <div class="legend">
        <span><i style="background:var(--series-1)"></i>${T.legBuzz}</span>
        <span><i style="background:var(--reference)"></i>${T.legBase}</span>
      </div>
      <!-- The spread, not just the mean. The overlap figure above is an average
           over every week the snapshots can answer, and without the dispersion
           beside it a 0.05 difference between two scoring variants reads as a
           finding when it sits well inside the week-to-week noise. -->
      ${a.overlap_sd === null || a.overlap_sd === undefined ? ''
        : `<p class="sub" style="margin:10px 0 0">${T.overlapSpread(
             (a.overlap_sd * 100).toFixed(1) + '%p', a.overlap_sample_weeks,
             a.overlap_rows)}</p>`}
    </div>

    <div class="card">
      <h3>${T.mLimits}</h3>
      <p class="sub" style="margin-bottom:10px">${T.mLimitsSub}</p>
      <dl class="kv">${limits.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      <p class="sub" style="margin:14px 0 0"><b>${esc(T.genreLimit)}</b> — ${T.genreLimitBody}</p>
      <div class="genrekey" style="margin-top:10px">${Object.keys(DATA.genres || {}).map(g =>
        `<span><i style="background:${genrePaint(g, '135deg')}"></i>${esc(genreLabel(g))}</span>`).join('')}</div>
    </div>

    <div class="card">
      <h3>${T.mDisc}</h3>
      <p class="sub">${T.mDiscSub}</p>
      <div class="tw"><table>
        <thead><tr><th>${T.thSurface}</th><th class="r">z</th><th class="r">${T.thMentions}</th>
          <th>${T.thOnset}</th></tr></thead>
        <tbody>${DATA.discovery.map(d => `<tr><td>${esc(d.surface)}</td>
          <td class="num r">${d.z.toFixed(1)}</td>
          <td class="num r">${d.total_mentions.toLocaleString()}</td>
          <td>${esc(d.peak_day)}</td></tr>`).join('')
          || `<tr><td colspan="4" style="color:var(--ink-2)">${T.noCandidates}</td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="card">
      <h3>${T.mCorpus}</h3>
      <dl class="kv">${T.corpusKv.map((k, i) =>
        `<dt>${esc(k)}</dt><dd>${esc(corpusVals[i])}</dd>`).join('')}</dl>
    </div>`;
}

/* 방문자 수. 값이 없으면 요소째로 숨긴다 -- "오늘 0명"은 아무도 안 왔다는
   뜻이 아니라 우리가 못 셌다는 뜻인데, 페이지 위에서 그 둘은 구분되지 않는다.
   mount() 에서 다시 그리는 이유는 언어 전환 때문이다: 숫자는 그대로여도 문장이
   바뀐다. */
function renderHits() {
  const el = $('#hits');
  if (!el) return;
  if (!HITS) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = T.hits(`<b>${HITS.today.toLocaleString()}</b>`,
                        `<b>${HITS.total.toLocaleString()}</b>`);
  el.title = T.hitsTip;
}

/* ── mount ──────────────────────────────────────────────────────────── */
function mount() {
  T = I18N[state.lang] || I18N.ko;
  document.documentElement.lang = state.lang;

  $('#tagline').textContent = T.tagline;
  renderHits();
  const tabs = document.querySelectorAll('nav.tabs button');
  tabs[0].textContent = T.tabHome;
  tabs[1].textContent = T.tabMethod;
  tabs.forEach(b => b.setAttribute('aria-current',
    (b.dataset.view === state.view || (state.view === 'detail' && b.dataset.view === 'home'))
      ? 'page' : 'false'));
  document.querySelectorAll('#langsel button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));

  // Two dates, said separately, because they are different facts and printing
  // one of them as "기준" made the other one look wrong. The stamp is when the
  // ranking was confirmed; the window is how current the data inside it is.
  $('#updated').innerHTML =
    `<span class="stamp">${esc(fmtKstDate(new Date(DATA.generated_at)))} ${esc(T.confirmedSuffix)}</span>`
    + `<span class="nextup">${esc(T.dataThrough)} ${esc(fmtKstDate(new Date(DATA.history_end)))}`
    + ` · ${esc(T.nextUpdate)} ${esc(fmtKstDate(nextUpdate()))} 00:00</span>`;
  const anyPoster = DATA.titles.some(t => t.poster);
  // Attribution is a CC BY-SA term on the pageview data, so it renders in every
  // build including the ranking-only one. Hiding the methodology is a product
  // choice; dropping attribution would be a licence breach.
  const attribEl = $('#attrib');
  if (attribEl) {
    const list = DATA.attribution || [];
    attribEl.innerHTML = list.length
      ? T.attribLead + ' ' + list.map(a =>
          `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a> (${esc(a.license)})`
        ).join(' · ')
      : '';
  }
  $('#foot').innerHTML = T.footer
    + (DATA.synthetic ? ` <b style="color:var(--warning)">${T.footerSynth}</b> ${T.footerSynthTail}` : '')
    + (anyPoster ? `<br>${T.tmdbAttr}` : `<br>${T.posterNote}`);
  const notice = $('#notice');
  if (notice) notice.innerHTML =
    `<i class="icon">⚠</i><b>${T.synthTitle}</b> ${T.synthBody}`;

  const app = $('#app');
  if (state.view === 'detail') {
    app.innerHTML = viewDetail(state.id);
    const t = DATA.titles.find(x => x.id === state.id);
    if (t) {
      track('title_view', { title_id: t.id, buzz_rank: t.rank, genre: genreOf(t) });
      track('buzz_chart_view', { title_id: t.id, range: state.range });
      track('source_breakdown_view', { title_id: t.id });
      if (t.low_signal) {
        track('low_signal_badge_view', { title_id: t.id, source_count: t.sources.length });
      }
    }
  } else if (state.view === 'methodology') {
    app.innerHTML = viewMethodology();
    track('methodology_view', { referrer: document.referrer || null });
  } else {
    app.innerHTML = viewHome();
    track('ranking_view', {
      kind: state.kind, genre: state.genre, platform: state.plat,
      released: state.rel, sort: state.sort, results: visible().length,
    });
  }

  if (state.view === 'home') {
    app.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { state.kind = b.dataset.kind; navigate(); });
    const sel = $('#sort'); if (sel) sel.onchange = e => { state.sort = e.target.value; navigate(); };
    const pf = $('#plat'); if (pf) pf.onchange = e => { state.plat = e.target.value; navigate(); };
    const gs = $('#genre'); if (gs) gs.onchange = e => { state.genre = e.target.value; navigate(); };
    const rs = $('#rel'); if (rs) rs.onchange = e => { state.rel = e.target.value; navigate(); };
    ['#genre', '#plat', '#rel', '#sort'].forEach(sel => {
      const el = $(sel);
      if (el) el.addEventListener('change', () =>
        track('filter_change', { control: sel.slice(1), value: el.value }));
    });
    const q = $('#q');
    if (q) q.oninput = e => {
      state.q = e.target.value;
      const at = e.target.selectionStart;
      navigate();
      const nq = $('#q'); if (nq) { nq.focus(); nq.setSelectionRange(at, at); }
    };
    const open = el => {
      state.id = el.dataset.id; state.view = 'detail'; state.range = '7d'; navigate(true);
    };
    app.querySelectorAll('tr.row, .rise').forEach(el => {
      el.onclick = () => open(el);
      el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el); } };
    });
  }

  if (state.view === 'detail') {
    $('#back').onclick = () => { state.view = 'home'; navigate(); };
    app.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { state.range = b.dataset.range; navigate(); });
    const t = DATA.titles.find(x => x.id === state.id);
    const buckets = { '24h': 4, '7d': 28, '30d': 120 }[state.range];
    const series = t.series.slice(-buckets);
    const end = new Date(DATA.history_end).getTime();
    const stamps = series.map((_, i) =>
      new Date(end - (series.length - 1 - i) * DATA.bucket_hours * 3600e3).toISOString());
    areaChart($('#hist'), series, stamps, T.chartAria(titleOf(t)));
    const total = t.sources.reduce((s, c) => s + c.volume, 0) || 1;
    barChart($('#src'), t.sources.map(c => ({
      label: c.source, value: c.volume, display: `${(c.volume / total * 100).toFixed(0)}%`
    })), { label: T.sources, max: total });
    wireTable('#ht', '#htable'); wireTable('#st', '#stable');
    app.querySelectorAll('.watchbtn').forEach(b => b.onclick = () =>
      track('watch_outlink_click', { title_id: t.id, platform: b.dataset.pf, buzz_rank: t.rank }));
  }

  if (state.view === 'methodology') {
    const a = DATA.accuracy;
    barChart($('#acc'), [
      { label: T.barBuzz, value: a.overlap_buzz, display: pct(a.overlap_buzz) },
      { label: T.barBase, value: a.overlap_persistence, display: pct(a.overlap_persistence), reference: true }
    ], { label: T.mOverlap, labelWidth: 112, max: 1 });
  }
}

document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  state.view = b.dataset.view; navigate(true);
});
document.querySelectorAll('#langsel button').forEach(b => b.onclick = () => {
  track('language_switch', { to: b.dataset.lang });
  setLang(b.dataset.lang);
});

if (DATA.synthetic) {
  const n = document.createElement('div');
  n.className = 'notice'; n.id = 'notice';
  $('.wrap').insertBefore(n, $('#app'));
}

// Precedence: an explicit link wins, then a remembered choice, then the browser.
try {
  const saved = localStorage.getItem('buzzrank.lang');
  if (['ko','en'].includes(saved)) state.lang = saved;
  else if (!(navigator.language || '').toLowerCase().startsWith('ko')) state.lang = 'en';
} catch (e) {}
fromHash();
mount();

// 카운터는 페이지가 그려진 뒤에 한 번만 부른다. 실패하면 조용히 없는 채로
// 둔다 -- 랭킹은 카운터가 없어도 완전한 페이지고, 그 반대는 아니다.
if (COUNTER) {
  fetch(COUNTER, { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (j && Number.isFinite(j.today) && Number.isFinite(j.total)) {
        HITS = j;
        renderHits();
      }
    })
    .catch(() => {});
}

addEventListener('resize', () => { if (state.view !== 'home') mount(); });
</script>

</body>
</html>
